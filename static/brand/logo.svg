<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 56" role="img" aria-label="问津 · WenJin 横版字锁">
  <!--
    问津 · WenJin · 横版字锁（产品方标 + 标准字锁）
    遵循鹿溪设计范式 v1.1
  -->
  <defs>
    <linearGradient id="logo-stream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00D2FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7CF0FF" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- 产品方标（48×48） -->
  <g transform="translate(4, 4)">
    <rect width="48" height="48" rx="12" fill="#0D5E42"/>
    <g transform="translate(12, 10)" fill="none" stroke="#F5F7FA" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 18c4-10 8-10 12 0"/>
      <path d="M12 8v4"/>
      <circle cx="12" cy="7" r="1.6" fill="#F1C40F" stroke="none"/>
    </g>
    <rect x="8" y="39" width="32" height="3" rx="1.5" fill="url(#logo-stream)"/>
    <polygon points="41,5 41.6,6.8 43.5,6.8 41.9,7.9 42.5,9.6 41,8.5 39.5,9.6 40.1,7.9 38.5,6.8 40.4,6.8" fill="#F1C40F"/>
  </g>

  <!-- 品牌文字字锁 -->
  <text x="66" y="28" fill="#0D5E42" font-family="'PingFang SC', 'HarmonyOS Sans SC', system-ui, sans-serif"
        font-size="20" font-weight="700" letter-spacing="-0.01em">问津 · WenJin</text>
  <text x="66" y="46" fill="#64748B" font-family="'PingFang SC', 'HarmonyOS Sans SC', system-ui, sans-serif"
        font-size="12" letter-spacing="0.04em">向道问津，顺溪成程 · 志愿推演</text>
</svg>
